[project]
name = "real-estate-risk-detector"
version = "0.1.0"
description = "Offline Bagging-based real-estate contract risk detection research demo"
requires-python = ">=3.12"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

